name: Build & Push telegram-downloader

# 手动点击触发（Actions 页面 → 选择本工作流 → Run workflow）
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签 (默认 latest)"
        required: false
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 设置默认tag
      - name: Set default tag
        run: |
          echo "TAG=latest" >> $GITHUB_ENV
          echo "IMAGE_TAGS=${{ github.repository_owner }}/telegram-downloader:${{ github.event.inputs.tag }}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
